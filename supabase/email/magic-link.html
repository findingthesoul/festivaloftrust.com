<!--
  Supabase → Authentication → Emails → Magic Link.

  The code comes first because that is what the sign-in screen asks for. The
  link stays underneath because host invitations are sent through this same
  template and carry a redirect to one festival — a code cannot carry that.
-->
<table width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background:#feecd2;padding:40px 0;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;color:#181717;">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" border="0"
             style="max-width:440px;padding:0 24px;">
        <tr>
          <td>
            <p style="margin:0 0 28px;font-size:14px;letter-spacing:0.08em;text-transform:uppercase;color:#181717;opacity:0.6;">
              Festival of Trust
            </p>
            <h1 style="margin:0 0 24px;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-0.02em;">
              Your sign-in code
            </h1>
            <p style="margin:0 0 12px;font-size:16px;line-height:1.6;">
              Enter this code on the sign-in screen.
            </p>
            <p style="margin:0 0 28px;font-size:40px;line-height:1;font-weight:700;letter-spacing:0.12em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;">
              {{ .Token }}
            </p>
            <p style="margin:0 0 28px;font-size:14px;line-height:1.6;opacity:0.7;">
              It expires in an hour. If you did not ask to sign in, ignore this
              email — nothing happens until the code is used.
            </p>
            <p style="margin:0;font-size:14px;line-height:1.6;">
              Or <a href="{{ .ConfirmationURL }}" style="color:#077c4c;">open the
              festival directly</a>.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
